<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            width: 100%;
            text-align: center;
            border-color: rgb(200, 50, 50);
            background-color:aliceblue;
             color: rgb(0, 0, 0);
        }
       div{
        font-size: xx-large;
       }
    </style>
    <script></script>
</head>
<body>
    <!-- table 
    thead
    tbody
    tfoot
    tr -> table row
    td -> table data cell
    th -> table header cell
    -->


    <div>
        <p>this &lt; p &gt; is text</>
<table border="1" >
    <caption><span>info</span></caption>
        <tfoot style="font-style: italic;">
        <tr>
            <td colspan="2"> total  </td>
            <td > 50000  </td>
        </tr>
    </tfoot>
    <thead>
        <tr style="font-style: italic;">
            <td><b>name</b></td>
            <td><b>color</b></td>
            <td><b>price</b></td>
        </tr>
    </thead>
    <tbody>
            
        <tr>
            <td>msi</td>
            <td>black</td>
            <td>20000</td>
        </tr>
        <tr>
            <td>msi</td>
            <td>white</td>
            <td>20000</td>
        </tr>
        <tr>
            <td>msi</td>
            <td>red</td>
            <td>10000</td>
        </tr>

        
    </tbody>
   
</table>
</div>
</body>
</html>
